name: Repair pnpm lockfile for Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.11.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile with Cloudflare pnpm version
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already compatible with pnpm 10.11.1"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "fix: regenerate pnpm lockfile for Cloudflare"
          git push
